name: Precompile

# Builds the precompiled Rebus.UnixFD libraries for every published target,
# checks what each needs from the system that loads it, and runs the unit
# suite against each on the oldest and newest supported Erlang/OTP. CI runs
# this on every change; Publish runs it for a release and publishes the
# archives it uploads.

on:
  workflow_call:

permissions:
  contents: read

env:
  # Build the Rebus.UnixFD NIF with -Werror (see Makefile). A called workflow
  # does not inherit its caller's env.
  REBUS_NIF_WERROR: '1'

jobs:
  linux:
    name: Precompile (${{ matrix.target }})
    # Each target builds and tests in Docker on a runner of its own
    # architecture; see bin/precompile-linux for the images.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-linux-musl
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build, check and test
        run: |
          printf '| Target | Library (bytes) | Archive (bytes) |\n|---|--:|--:|\n' >> "$GITHUB_STEP_SUMMARY"
          bin/precompile-linux ${{ matrix.target }} precompiled

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: precompiled-${{ matrix.target }}
          path: |
            precompiled/*.tar.gz
            precompiled/*.sha256
          if-no-files-found: error

  macos:
    name: Precompile (macOS)
    # An Apple silicon runner builds both macOS targets.
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.5'
          otp-version: '28.3'
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Build and check
        run: |
          printf '| Target | Library (bytes) | Archive (bytes) |\n|---|--:|--:|\n' >> "$GITHUB_STEP_SUMMARY"
          bin/precompile-macos build precompiled

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: precompiled-macos
          path: |
            precompiled/*.tar.gz
            precompiled/*.sha256
            precompiled/checksum-macos.exs
          if-no-files-found: error

  macos-test:
    name: Test precompiled (${{ matrix.target }}, OTP ${{ matrix.otp }})
    needs: macos
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            elixir: '1.18'
            otp: '27'
          - target: aarch64-apple-darwin
            runner: macos-15
            elixir: '1.20'
            otp: '29'
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            elixir: '1.18'
            otp: '27'
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            elixir: '1.20'
            otp: '29'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          name: precompiled-macos
          path: precompiled

      - name: Test
        run: bin/precompile-macos test ${{ matrix.target }} precompiled
