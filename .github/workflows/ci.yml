name: CI

on:
  push:
    branches: [main, github]
  pull_request:
    branches: [main]

env:
  # Build the Rebus.UnixFD NIF with -Werror (see Makefile).
  REBUS_NIF_WERROR: '1'

jobs:
  cppcheck:
    name: cppcheck (NIF source)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck

      # Self-contained: needs neither Elixir nor the ERTS and Fine headers.
      - name: Run cppcheck
        run: make cppcheck

  precompile:
    name: Precompile
    # The libraries a release would publish, built, checked and tested
    # without uploading them anywhere.
    uses: ./.github/workflows/precompile.yml

  precommit:
    name: Precommit (Elixir 1.19.5 / OTP 28.3)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.5'
          otp-version: '28.3'
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Restore dependencies and build cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-precommit-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-precommit-

      - name: Install dependencies
        run: mix deps.get

      # `mix precommit` runs `mix format`, which rewrites files rather than
      # failing. Check formatting first so CI still gates on it.
      - name: Check formatting
        run: mix format --check-formatted

      - name: Run precommit
        run: mix precommit

  integration:
    name: Integration (real dbus-daemon, Elixir 1.19.5 / OTP 28.3)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.5'
          otp-version: '28.3'
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Restore dependencies and build cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-integration-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-integration-

      - name: Install dependencies
        run: mix deps.get

      # ubuntu-24.04 already ships dbus; install it only if the runner image
      # ever drops it.
      - name: Ensure dbus-run-session is available
        run: |
          if ! command -v dbus-run-session >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends dbus
          fi

      # A private session bus, so nothing touches a bus the runner already has.
      - name: Run the integration suite
        run: dbus-run-session -- mix test --only integration

  test:
    name: Test (Linux, Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})${{ matrix.cover && ' + coverage' || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Keep this valid-combination matrix in step with Castle. The newest
        # pair is the sole coverage canary: coverage line attribution varies
        # between Elixir releases, while repeated readings add noise rather
        # than compatibility confidence.
        elixir: ['1.18', '1.19', '1.20']
        otp: ['27', '28', '29']
        exclude:
          # Elixir 1.18 supports Erlang/OTP 25-27.
          - elixir: '1.18'
            otp: '28'
          - elixir: '1.18'
            otp: '29'
          # Elixir 1.19 supports Erlang/OTP 26-28.
          - elixir: '1.19'
            otp: '29'
        include:
          - elixir: '1.20'
            otp: '29'
            cover: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Restore dependencies and build cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        if: ${{ !matrix.cover }}
        run: mix test

      - name: Run tests with coverage
        if: ${{ matrix.cover }}
        run: mix test --cover

  no-unix-fds:
    name: Test without Unix fd support (Linux, Elixir 1.20 / OTP 29)
    # Applications get no native code unless they enable Unix fd support, so
    # one leg builds Rebus that way. REBUS_UNIX_FDS=0 builds into
    # _build/no_unix_fds; the cache key keeps it apart from the other legs.
    runs-on: ubuntu-24.04
    env:
      REBUS_UNIX_FDS: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20'
          otp-version: '29'
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Restore dependencies and build cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-no-unix-fds-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-no-unix-fds-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

  unix-fd-macos:
    name: Unix FD lifecycle (macOS, Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    # Unix FD passing is intentionally supported only on Linux and macOS.
    # Linux runs the same ordinary ExUnit suite in `test` above; this separate
    # macOS matrix makes the platform-specific lifecycle coverage visible. BSD,
    # other Unix variants, and Windows are deliberately out of scope.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # Match the Linux compatibility matrix exactly. Coverage remains a
        # single Linux canary; macOS establishes runtime/FD compatibility.
        elixir: ['1.18', '1.19', '1.20']
        otp: ['27', '28', '29']
        exclude:
          - elixir: '1.18'
            otp: '28'
          - elixir: '1.18'
            otp: '29'
          - elixir: '1.19'
            otp: '29'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Restore dependencies and build cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        # This intentionally runs the ordinary suite, including
        # test/rebus/unix_fd_test.exs. It is not a separate FD-only harness.
        run: mix test

  dialyzer:
    name: Dialyzer (Elixir 1.19.5 / OTP 28.3)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.5'
          otp-version: '28.3'
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Restore dependencies and build cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-dialyzer-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-dialyzer-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Restore PLT cache
        id: cache-plt
        uses: actions/cache/restore@v5
        with:
          path: _build/plts
          key: plt-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Create PLTs
        if: steps.cache-plt.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Save PLT cache
        if: steps.cache-plt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: _build/plts
          key: plt-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}

      - name: Run dialyzer
        run: mix dialyzer --format github --format dialyxir

  docs:
    name: Documentation (Elixir 1.19.5 / OTP 28.3)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.5'
          otp-version: '28.3'
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Restore dependencies and build cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-docs-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-docs-

      - name: Install dependencies
        run: mix deps.get

      - name: Generate docs
        run: mix docs

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: doc/
