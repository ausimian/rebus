name: CI

on:
  push:
    branches: [main, github]
  pull_request:
    branches: [main]

jobs:
  precommit:
    name: Precommit (Elixir 1.19.5 / OTP 28.3)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.5'
          otp-version: '28.3'
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Restore dependencies and build cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-precommit-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-precommit-

      - name: Install dependencies
        run: mix deps.get

      # Rebus has not defined a `mix precommit` alias yet. Keep this pinned
      # gate equivalent to its local convention until it does.
      - name: Check for unused dependencies
        run: mix deps.unlock --unused

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

  test:
    name: Test (Linux, Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})${{ matrix.cover && ' + coverage' || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # These are the valid Elixir/OTP pairings in Rebus's declared
          # support range. Keep the newest pair as the sole coverage canary:
          # coverage line attribution varies between Elixir releases, while
          # repeated readings add noise rather than compatibility confidence.
          - elixir: '1.17.3'
            otp: '26.2'
            cover: false
          - elixir: '1.18.2'
            otp: '27.1'
            cover: false
          - elixir: '1.19.1'
            otp: '27.1'
            cover: false
          - elixir: '1.19.5'
            otp: '28.3'
            cover: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Restore dependencies and build cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        if: ${{ !matrix.cover }}
        run: mix test

      - name: Run tests with coverage
        if: ${{ matrix.cover }}
        run: mix test --cover

  unix-fd-macos:
    name: Unix FD lifecycle (macOS, Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    # Unix FD passing is intentionally supported only on Linux and macOS.
    # Linux runs the same ordinary ExUnit suite in `test` above; this separate
    # macOS matrix makes the platform-specific lifecycle coverage visible. BSD,
    # other Unix variants, and Windows are deliberately out of scope.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.17.3'
            otp: '26.2'
          - elixir: '1.18.2'
            otp: '27.1'
          - elixir: '1.19.1'
            otp: '27.1'
          - elixir: '1.19.5'
            otp: '28.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Restore dependencies and build cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        # This intentionally runs the ordinary suite, including
        # test/rebus/unix_fd_test.exs. It is not a separate FD-only harness.
        run: mix test

  dialyzer:
    name: Dialyzer (Elixir 1.19.5 / OTP 28.3)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.5'
          otp-version: '28.3'
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Restore dependencies and build cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-dialyzer-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-dialyzer-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Restore PLT cache
        id: cache-plt
        uses: actions/cache/restore@v5
        with:
          path: _build/plts
          key: plt-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Create PLTs
        if: steps.cache-plt.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Save PLT cache
        if: steps.cache-plt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: _build/plts
          key: plt-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}

      - name: Run dialyzer
        run: mix dialyzer --format github --format dialyxir

  docs:
    name: Documentation (Elixir 1.19.5 / OTP 28.3)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.5'
          otp-version: '28.3'
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Restore dependencies and build cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-docs-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-docs-

      - name: Install dependencies
        run: mix deps.get

      - name: Generate docs
        run: mix docs

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: doc/
